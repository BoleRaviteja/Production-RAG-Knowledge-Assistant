apiVersion: v1
kind: Service
metadata:
  name: {{ include "rag.fullname" . }}
  labels: {{- include "rag.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http, protocol: TCP }
  selector: {{- include "rag.selectorLabels" . | nindent 4 }}
