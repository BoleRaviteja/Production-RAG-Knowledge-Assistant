name: ci-cd

on:
  push:
    branches: [main]
  pull_request:

permissions:
  id-token: write   # OIDC -> AWS (no long-lived keys)
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: rag-assistant-prod
  EKS_CLUSTER: rag-assistant-prod
  APP_SECRET_ID: rag-assistant-prod/app
  # ^ keep these in sync with `terraform output`

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://rag:rag@localhost:5432/rag_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -v

  validate-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
        working-directory: terraform
      - run: terraform init -backend=false && terraform validate
        working-directory: terraform
      - uses: azure/setup-helm@v4
      - run: helm lint helm/rag-assistant
      - run: helm template rag helm/rag-assistant > /dev/null

  build-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, validate-infra]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - id: meta
        run: echo "image=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: production     # add required reviewers in repo settings for manual approval
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: azure/setup-helm@v4
      - name: Configure kubectl
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"
      - name: Render secrets values from AWS Secrets Manager
        run: |
          SECRET=$(aws secretsmanager get-secret-value --secret-id "$APP_SECRET_ID" \
                   --query SecretString --output text)
          echo "$SECRET" | jq -r '.[]' | while read -r v; do [ -n "$v" ] && echo "::add-mask::$v"; done
          echo "$SECRET" | jq '{secrets: .}' > "$RUNNER_TEMP/secrets.json"
      - name: Helm upgrade
        run: |
          helm upgrade --install rag helm/rag-assistant \
            --namespace rag --create-namespace \
            --set image.repository=${{ needs.build-push.outputs.image }} \
            --set image.tag=${{ github.sha }} \
            -f "$RUNNER_TEMP/secrets.json" \
            --atomic --wait --timeout 5m
      - run: kubectl -n rag rollout status deploy/rag-rag-assistant --timeout=120s
      - run: kubectl -n rag get pods,svc,ingress,hpa
